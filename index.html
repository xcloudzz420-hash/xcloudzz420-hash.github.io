<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamster Wallet | Coming Soon</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .container { max-width: 450px; padding: 20px; }
        .icon { font-size: 4rem; margin-bottom: 10px; }
        h1 { color: #58a6ff; font-size: 2.5rem; margin-bottom: 10px; margin-top: 0; }
        p { font-size: 1.1rem; line-height: 1.6; color: #8b949e; margin-bottom: 30px; }
        .form-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        input { 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            background: #010409; 
            color: white; 
            width: 60%; 
            outline: none;
        }
        input:focus { border-color: #58a6ff; }
        button { 
            padding: 12px 20px; 
            border-radius: 6px; 
            border: none; 
            background: #238636; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s;
        }
        button:hover { background: #2ea043; }
        .footer { margin-top: 40px; font-size: 0.8rem; color: #484f58; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🐹</div>
        <h1>Hamster Wallet</h1>
        <p>The next-generation crypto wallet for seamless swaps and secure storage. We are building the future of decentralized finance.</p>
        <div class="form-group">
            <input type="email" placeholder="Enter your email to join the waitlist...">
            <button onclick="alert('Thanks for joining the waitlist!')">Join Waitlist</button>
        </div>
        <div class="footer">
            &copy; 2026 Hamster Wallet. All rights reserved.
        </div>
    </div>
</body>
</html>
