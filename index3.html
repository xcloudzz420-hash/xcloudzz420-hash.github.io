<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Swap (Ohne JavaScript)</title>
    <style>
        /* CSS Variablen aus deinem Code */
        :root {
            --bg-main: #131722;
            --bg-input: #2a2e39;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --color-green: #00ff73;
        }

        /* Grundeinstellungen */
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .widget-container {
            background-color: var(--bg-main);
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2e39;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .input-box {
            background-color: var(--bg-input);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .input-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* Eingabefelder anpassen */
        select, input[type="number"], input[type="text"] {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        select {
            border-bottom: 1px solid var(--text-muted);
            padding-bottom: 5px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        /* Buttons (werden hier als <label> umgesetzt für den CSS-Trick) */
        .button {
            background-color: var(--color-green);
            color: black;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            display: block;
            box-sizing: border-box;
        }

        .button:hover {
            opacity: 0.9;
        }

        .back-btn {
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: normal;
        }

        /* ========================================================
           DER CSS-TRICK FÜR NAVIGATION OHNE JAVASCRIPT 
           ======================================================== */
        
        /* 1. Die Steuerungs-Checkoxen unsichtbar machen */
        input[name="step-control"] {
            display: none;
        }

        /* 2. Alle Schritte standardmäßig ausblenden */
        .step {
            display: none;
        }

        /* 3. Wenn Radiobutton 1 aktiv ist, zeige Step 1. usw. */
        #radio-step1:checked ~ .widget-container #step1 { display: block; }
        #radio-step2:checked ~ .widget-container #step2 { display: block; }
        #radio-step3:checked ~ .widget-container #step3 { display: block; }

    </style>
</head>
<body>

    <!-- Diese unsichtbaren Radio-Buttons steuern die Logik OHNE JavaScript -->
    <input type="radio" id="radio-step1" name="step-control" checked>
    <input type="radio" id="radio-step2" name="step-control">
    <input type="radio" id="radio-step3" name="step-control">

    <div class="widget-container">

        <!-- ==================== STEP 1 ==================== -->
        <div id="step1" class="step">
            <div class="header">
                <div>Exchange</div>
            </div>
            
            <div class="input-box">
                <div class="input-label">You send</div>
                <!-- Natives Dropdown anstelle des aufwendigen JS-Modals -->
                <select>
                    <option value="btc">BTC - Bitcoin</option>
                    <option value="eth">ETH - Ethereum</option>
                    <option value="usdt">USDT - Tether</option>
                    <option value="xmr">XMR - Monero</option>
                </select>
                <input type="number" placeholder="Amount (z.B. 0.5)">
            </div>

            <div class="input-box">
                <div class="input-label">You receive</div>
                <select>
                    <option value="eth">ETH - Ethereum</option>
                    <option value="btc">BTC - Bitcoin</option>
                    <option value="usdt">USDT - Tether</option>
                    <option value="xmr">XMR - Monero</option>
                </select>
                <!-- Ohne JS keine Live-Berechnung möglich -->
                <input type="text" placeholder="Wird später berechnet..." readonly>
            </div>

            <!-- Dieses Label klickt unsichtbar den Radio-Button für Step 2 an -->
            <label for="radio-step2" class="button">Exchange</label>
        </div>

        <!-- ==================== STEP 2 ==================== -->
        <div id="step2" class="step">
            <div class="header">
                <div>Transaction Details</div>
                <!-- Zurück zu Step 1 -->
                <label for="radio-step1" class="back-btn">&larr; Back</label>
            </div>

            <div class="input-box">
                <div class="input-label">Recipient Wallet Address</div>
                <input type="text" placeholder="Enter your address here">
            </div>

            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="terms" style="width: auto;">
                <label for="terms">I read and agree to the Terms of Use.</label>
            </div>

            <!-- Dieses Label klickt unsichtbar den Radio-Button für Step 3 an -->
            <label for="radio-step3" class="button">Confirm & Send</label>
        </div>

        <!-- ==================== STEP 3 ==================== -->
        <div id="step3" class="step">
            <div class="header">
                <div>Awaiting Deposit</div>
            </div>

            <div class="input-box" style="text-align: center;">
                <div class="input-label">Please send your funds to this address:</div>
                <div style="font-size: 14px; margin: 15px 0; word-break: break-all; color: white; font-weight: bold;">
                    0x1234567890abcdef1234567890abcdef12345678
                </div>
                <div class="input-label" style="color: var(--color-green);">Waiting for deposit...</div>
            </div>

            <!-- Zurück zum Start (Step 1) -->
            <label for="radio-step1" class="button" style="background-color: transparent; border: 1px solid var(--text-muted); color: white; margin-top: 15px;">Start New Exchange</label>
        </div>

    </div>

</body>
</html>
