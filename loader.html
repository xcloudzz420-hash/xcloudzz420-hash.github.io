<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octa-Swap Loading Screen</title>
  <style>
    /* Dunkler Hintergrund für den Test */
    body {
      background-color: #1a1a1a; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .octa-loader {
      position: relative;
      width: 120px;
      height: 120px;
    }

    /* Das Monero-Hamsterrad */
    .monero-wheel {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #4C4C4C; /* Monero Dunkelgrau */
      border-right-color: #FF6600; /* Monero Orange */
      border-bottom-color: #FF6600;
      box-sizing: border-box;
      animation: spinWheel 1s linear infinite;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.2);
    }

    /* Die Speichen im Rad */
    .spoke {
      position: absolute;
      top: 50%; left: 0;
      width: 100%; height: 2px;
      background: rgba(76, 76, 76, 0.3);
    }
    .spoke:nth-child(2) { transform: rotate(45deg); }
    .spoke:nth-child(3) { transform: rotate(90deg); }
    .spoke:nth-child(4) { transform: rotate(135deg); }

    /* Der flache Cartoon-Hamster */
    .cute-hamster {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -20%);
      width: 60px; height: 40px;
      animation: hamsterBounce 0.3s ease-in-out infinite alternate;
    }

    .hamster-body {
      width: 100%; height: 100%;
      background: #F4A261;
      border-radius: 30px 30px 15px 15px;
      position: relative;
      border: 2px solid #333;
    }

    .hamster-ear {
      position: absolute;
      top: -6px; right: 12px;
      width: 12px; height: 12px;
      background: #E76F51;
      border-radius: 50%;
      border: 2px solid #333;
    }

    .hamster-eye {
      position: absolute;
      top: 10px; right: 8px;
      width: 6px; height: 6px;
      background: #333;
      border-radius: 50%;
    }

    .hamster-leg {
      position: absolute;
      bottom: -6px;
      width: 8px; height: 10px;
      background: #E76F51;
      border-radius: 4px;
      border: 2px solid #333;
      animation: legRun 0.15s linear infinite alternate;
    }

    .hamster-leg.front { right: 10px; animation-delay: 0.15s; }
    .hamster-leg.back { left: 15px; }

    /* Die Animationen */
    @keyframes spinWheel {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes hamsterBounce {
      0% { transform: translate(-50%, -20%); }
      100% { transform: translate(-50%, -25%); }
    }

    @keyframes legRun {
      0% { transform: rotate(-20deg) translateY(0); }
      100% { transform: rotate(30deg) translateY(-3px); }
    }
  </style>
</head>
<body>

  <div class="octa-loader">
    <div class="monero-wheel">
      <div class="spoke"></div>
      <div class="spoke"></div>
      <div class="spoke"></div>
      <div class="spoke"></div>
    </div>
    <div class="cute-hamster">
      <div class="hamster-body">
        <div class="hamster-ear"></div>
        <div class="hamster-eye"></div>
        <div class="hamster-leg front"></div>
        <div class="hamster-leg back"></div>
      </div>
    </div>
  </div>

</body>
</html>
